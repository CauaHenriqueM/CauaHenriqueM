# Desenha a "cobrinha" comendo o seu gráfico de contribuições e publica os SVGs
# numa branch separada (`output`). O README aponta para lá — por isso a imagem
# se atualiza sozinha sem nenhum commit seu na `main`.
name: Cobrinha das contribuições

on:
  schedule:
    # A cada 12 horas. O gráfico muda pouco; rodar de hora em hora só gasta minuto.
    - cron: '0 */12 * * *'
  # Permite rodar na mão pela aba Actions — útil no primeiro teste.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      # Sem isto o passo de publicar não consegue escrever na branch `output`.
      contents: write
    steps:
      - name: Gerar os SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Duas versões: a clara e a escura, que o <picture> do README escolhe
          # conforme o tema de quem está olhando.
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
